/* =========================
   CONFIGURAÇÕES GERAIS
========================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at 50% 45%,
            #1b2942 0%,
            #0d1729 42%,
            #050913 78%,
            #02040a 100%
        );

    font-family: Georgia, "Times New Roman", serif;
}


/* =========================
   CENA
========================= */

.cena {

    position: relative;

    width: min(82vw, 390px);
    aspect-ratio: 2 / 3;

    perspective: 1800px;
}


/* =========================
   SOMBRA NO CHÃO
========================= */

.sombra {

    position: absolute;

    left: 8%;
    right: 8%;
    bottom: 1%;

    height: 10%;

    background: rgba(0,0,0,.6);

    border-radius: 50%;

    filter: blur(20px);
}


/* =========================
   FOLHA INTERNA
========================= */

.folha {

    position: absolute;

    width: 86%;
    height: 86%;

    left: 7%;
    top: 7%;

    padding: 42px 28px;

    background:
        linear-gradient(
            135deg,
            #f7f4ee,
            #e8e4dc
        );

    color: #161c27;

    box-shadow:
        0 15px 35px rgba(0,0,0,.35);

    transform:
        translateY(7%);

    transition:
        transform 1.5s cubic-bezier(.2,.75,.2,1);

    z-index: 1;
}

.folha h1 {

    font-size: 30px;

    font-weight: normal;

    letter-spacing: 3px;

    margin-bottom: 14px;
}

.folha p {

    font-family: Arial, sans-serif;

    font-size: 10px;

    line-height: 1.8;

    letter-spacing: 2px;

    color: #555;
}


/* =========================
   ENVELOPE
========================= */

.envelope {

    position: absolute;

    inset: 0;

    z-index: 5;

    transform-style: preserve-3d;
}


/* =========================
   CORPO DO ENVELOPE
========================= */

.corpo {

    position: absolute;

    inset: 0;

    overflow: hidden;

    border-radius: 3px;

    border: 1px solid rgba(190,195,204,.65);

    background:

        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,.025) 0px,
            rgba(255,255,255,.025) 1px,
            transparent 1px,
            transparent 5px
        ),

        radial-gradient(
            circle at 50% 35%,
            rgba(71,91,123,.2),
            transparent 43%
        ),

        linear-gradient(
            145deg,
            #15223a,
            #091120 55%,
            #101b30
        );

    box-shadow:
        0 20px 40px rgba(0,0,0,.45);
}


/* =========================
   BORDA INTERNA
========================= */

.corpo::before {

    content: "";

    position: absolute;

    inset: 12px;

    border: 1px solid rgba(193,198,207,.3);

    pointer-events: none;
}


/* =========================
   DOBRA ESQUERDA
========================= */

.dobra-esquerda {

    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 62%;

    z-index: 3;

    clip-path:
        polygon(
            0 0,
            50% 100%,
            0 100%
        );

    background:
        linear-gradient(
            145deg,
            #18263e,
            #091120
        );

    border-top: 1px solid rgba(180,185,196,.25);
}


/* =========================
   DOBRA DIREITA
========================= */

.dobra-direita {

    position: absolute;

    right: 0;
    bottom: 0;

    width: 100%;
    height: 62%;

    z-index: 3;

    clip-path:
        polygon(
            100% 0,
            50% 100%,
            100% 100%
        );

    background:
        linear-gradient(
            215deg,
            #18263e,
            #091120
        );

    border-top: 1px solid rgba(180,185,196,.25);
}


/* =========================
   DOBRA INFERIOR
========================= */

.dobra-inferior {

    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 52%;

    z-index: 4;

    clip-path:
        polygon(
            0 100%,
            50% 20%,
            100% 100%
        );

    background:
        linear-gradient(
            180deg,
            #101c31,
            #08101e
        );

    border-top: 1px solid rgba(180,185,196,.3);
}

   ABA SUPERIOR
