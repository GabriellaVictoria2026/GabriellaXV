<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gabriella Victória</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  min-height:100%;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 38%, #1b2a43 0%, #101b2d 38%, #050a13 78%);
  font-family:Georgia, "Times New Roman", serif;
}

/* leve textura do fundo */
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.18;
  background:
    repeating-linear-gradient(
      0deg,
      transparent 0px,
      transparent 3px,
      rgba(255,255,255,.025) 4px
    );
}

.cena{
  position:relative;
  width:min(82vw,390px);
  height:min(123vw,585px);
  display:flex;
  align-items:center;
  justify-content:center;
}

/* sombra do envelope */
.sombra{
  position:absolute;
  width:78%;
  height:35px;
  bottom:5%;
  border-radius:50%;
  background:rgba(0,0,0,.7);
  filter:blur(18px);
}

/* ENVELOPE */
.envelope{
  position:relative;
  width:100%;
  height:100%;
  border-radius:4px;
  overflow:visible;
  filter:drop-shadow(0 25px 28px rgba(0,0,0,.55));
}

/* corpo principal */
.corpo{
  position:absolute;
  inset:0;
  overflow:hidden;
  border-radius:4px;
  background:
    repeating-linear-gradient(
      90deg,
      rgba(255,255,255,.018) 0px,
      rgba(255,255,255,.018) 1px,
      transparent 1px,
      transparent 5px
    ),
    linear-gradient(
      145deg,
      #17263e 0%,
      #0d192c 48%,
      #08101e 100%
    );
  border:1px solid rgba(205,210,220,.65);
}

/* moldura interna */
.corpo::after{
  content:"";
  position:absolute;
  inset:14px;
  border:1px solid rgba(210,215,224,.28);
  pointer-events:none;
}

/* dobra inferior esquerda */
.esquerda{
  position:absolute;
  left:0;
  bottom:0;
  width:100%;
  height:58%;
  background:linear-gradient(
    145deg,
    #1a2b44 0%,
    #0a1424 72%
  );
  clip-path:polygon(0 0, 50% 100%, 0 100%);
  border-top:1px solid rgba(210,215,224,.35);
  z-index:3;
}

/* dobra inferior direita */
.direita{
  position:absolute;
  right:0;
  bottom:0;
  width:100%;
  height:58%;
  background:linear-gradient(
    215deg,
    #1a2b44 0%,
    #0a1424 72%
  );
  clip-path:polygon(100% 0, 50% 100%, 100% 100%);
  border-top:1px solid rgba(210,215,224,.35);
  z-index:3;
}

/* linha central inferior */
.base{
  position:absolute;
  left:0;
  bottom:0;
  width:100%;
  height:50%;
  background:
    linear-gradient(
      180deg,
      rgba(20,34,54,.2),
      #091321
    );
  clip-path:polygon(0 100%, 50% 0, 100% 100%);
  border-top:1px solid rgba(210,215,224,.3);
  z-index:4;
}

/* ABA SUPERIOR */
.aba{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:51%;
  background:
    linear-gradient(
      180deg,
      #1d2d47 0%,
      #14233a 45%,
      #0a1425 100%
    );
  clip-path:polygon(0 0, 100% 0, 50% 100%);
  z-index:10;
  transform-origin:50% 0%;
  transition:
    transform 1.25s cubic-bezier(.2,.75,.2,1),
    opacity .3s ease;
  border-top:1px solid rgba(220,224,231,.75);
}

/* linha metálica da aba */
.aba::after{
  content:"";
  position:absolute;
  left:9%;
  right:9%;
  top:1px;
  height:1px;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(240,242,245,.8),
    transparent
  );
}

/* LACRE */
.lacre{
  position:absolute;
  z-index:20;
  left:50%;
  top:50%;
  width:104px;
  height:104px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  cursor:pointer;

  display:flex;
  align-items:center;
  justify-content:center;

      circle at 30% 22%,
      #ffffff 0%,
      #e2e4e7 20%,
      #aeb2b8 45%,
      #676c74 68%,
      #d8dade 100%
    );
