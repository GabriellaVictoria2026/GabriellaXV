<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gabriella Victória</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    width: 100%;
    min-height: 100vh;
    overflow: hidden;
    background: #050914;
    font-family: Georgia, serif;
}

/* CAPA */

.capa {
    position: fixed;
    inset: 0;
    z-index: 10;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at center,
            rgba(35, 48, 78, 0.45),
            transparent 55%
        ),
        linear-gradient(
            135deg,
            #030610,
            #0b1428,
            #03050c
        );

    perspective: 1800px;

    transition:
        transform 1.4s ease,
        opacity 1.2s ease;
}

/* LOGO */

.logo {
    width: min(70vw, 330px);

    cursor: pointer;

    transition:
        transform 0.4s ease,
        filter 0.4s ease;

    filter:
        drop-shadow(0 10px 20px rgba(0,0,0,0.6));
}

.logo:active {
    transform: scale(0.95);
}

/* ABERTURA */

.capa.aberta {
    transform:
        perspective(1800px)
        rotateY(-100deg);

    transform-origin: left center;

    opacity: 0;
}

/* PARTE DE DENTRO */

.interior {
    position: fixed;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    color: #eee;

    background:
        radial-gradient(
            circle at center,
            rgba(35, 48, 78, 0.35),
            transparent 60%
        ),
        #050914;

    opacity: 0;

    transform: scale(1.05);

    transition:
        opacity 1.3s ease,
        transform 1.3s ease;
}

.interior.visivel {
    opacity: 1;
    transform: scale(1);
}

.interior h1 {
    font-size: 34px;
    font-weight: normal;
    letter-spacing: 5px;
}

.interior p {
    margin-top: 15px;
    font-size: 13px;
    letter-spacing: 3px;
    opacity: 0.65;
}

</style>
</head>

<body>

<!-- CAPA -->

<div class="capa" id="capa">

    <img
        class="logo"
        src="./file_00000000dc38820e926687e1df4ed0a4.png"
        alt="Logo GV"
        id="logo"
    >

</div>


<!-- INTERIOR -->

<div class="interior" id="interior">

    <div>

        <h1>Gabriella Victória</h1>

        <p>Uma noite para celebrar</p>

    </div>

</div>


<script>

const logo = document.getElementById("logo");

const capa = document.getElementById("capa");

const interior = document.getElementById("interior");


logo.addEventListener("click", function() {

    capa.classList.add("aberta");

    setTimeout(function() {

        interior.classList.add("visivel");

    }, 600);

});

</script>

</body>
</html>
