<head>

<title>Gabriella Victória — 15 anos</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;

    background:

        radial-gradient(
            circle at 50% 42%,
            #263957 0%,
            #111d31 42%,
            #070d17 78%,
            #03060b 100%
        );

    font-family:
        Georgia,
        "Times New Roman",
        serif;

}


/* LUZ SUAVE DO FUNDO */

body::before{

    content:"";

    position:fixed;

    inset:0;

    pointer-events:none;

    background:

        radial-gradient(
            ellipse at center,
            rgba(255,255,255,.055),
            transparent 58%
        );

}


/* PEQUENA TEXTURA */

body::after{

    content:"";

    position:fixed;

    inset:0;

    pointer-events:none;

    opacity:.16;

    background:

        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,.018) 0px,
            rgba(255,255,255,.018) 1px,
            transparent 1px,
            transparent 4px
        );

}


/* CENA */

.cena{

    position:relative;

    width:340px;

    height:560px;

    display:flex;

    align-items:center;

    justify-content:center;

}


/* SOMBRA NO CHÃO */

.sombra{

    position:absolute;

    width:260px;

    height:34px;

    bottom:42px;

    left:40px;

    border-radius:50%;

    background:
        rgba(0,0,0,.72);

    filter:blur(20px);

}


/* ENVELOPE */

.envelope{

    position:relative;

    width:300px;

    height:450px;

    filter:

        drop-shadow(
            0 30px 35px rgba(0,0,0,.60)
        );

    perspective:1400px;

}


/* CORPO PRINCIPAL */

.corpo{

    position:absolute;

    overflow:hidden;

    border-radius:4px;

    border:

    background:

        linear-gradient(
            145deg,
            #1b2b45 0%,
            #111f35 38%,
            #091322 100%
        );

}
