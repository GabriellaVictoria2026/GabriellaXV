<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gabriella Victória</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
}

body{
  min-height:100vh;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;

  background:
    radial-gradient(
      ellipse at 50% 40%,
      #18263d 0%,
      #0d1728 42%,
      #050a12 100%
    );

  font-family:Georgia,"Times New Roman",serif;
}

/* luz muito discreta no ambiente */
body::after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;

  background:
    radial-gradient(
      ellipse at 50% 30%,
      rgba(255,255,255,.035),
      transparent 48%
    );
}

/* palco */
.cena{
  position:relative;
  width:320px;
  height:520px;

  display:flex;
  align-items:center;
  justify-content:center;
}

/* sombra do envelope */
.sombra{
  position:absolute;
  width:245px;
  height:30px;
  left:37px;
  bottom:13px;

  border-radius:50%;

  background:rgba(0,0,0,.72);
  filter:blur(17px);
}

/* envelope completo */
.envelope{
  position:relative;

  width:300px;
  height:450px;

  z-index:2;

  perspective:1200px;

  filter:
    drop-shadow(0 25px 30px rgba(0,0,0,.55));
}

/* ==================================================
   CORPO
   ================================================== */

.corpo{
  position:absolute;
  inset:0;

  overflow:hidden;

  background:
    linear-gradient(
      135deg,
      #192942 0%,
      #101d31 43%,
      #081220 100%
    );

  border:1px solid rgba(211,216,225,.72);

  border-radius:3px;
}

/* textura extremamente sutil */
.corpo::before{
  content:"";
  position:absolute;
  inset:0;

  opacity:.14;

  background:
    repeating-linear-gradient(
      0deg,
      rgba(255,255,255,.025) 0px,
      rgba(255,255,255,.025) 1px,
      transparent 1px,
      transparent 4px
    );
}

/* moldura */
.moldura{
  position:absolute;
  inset:12px;

  border:1px solid rgba(205,211,220,.25);

  pointer-events:none;
}

/* ==================================================
   DOBRAS LATERAIS
   ================================================== */

.dobra-esquerda{
  position:absolute;

  left:0;
  bottom:0;

  width:300px;
  height:270px;

  background:
    linear-gradient(
      140deg,
      #1b2c45,
      #0a1423 72%
    );

  clip-path:
    polygon(
      0 0,
      50% 100%,
      0 100%
    );

  border-top:1px solid rgba(213,218,225,.34);

  z-index:3;
}

.dobra-direita{
  position:absolute;

  right:0;
  bottom:0;

  width:300px;
  height:270px;

  background:
    linear-gradient(
      220deg,
      #1b2c45,
      #0a1423 72%
    );

  clip-path:
    polygon(
      100% 0,
      50% 100%,
      100% 100%
    );

  border-top:1px solid rgba(213,218,225,.34);

  z-index:3;
}
