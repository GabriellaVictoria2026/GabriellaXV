<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gabriella Victória</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background:
        radial-gradient(circle at 50% 45%, rgba(255,255,255,0.055), transparent 32%),
        linear-gradient(135deg, #050914 0%, #0a1020 48%, #03050b 100%);
    font-family: Georgia, "Times New Roman", serif;
}

/* Capa */
.cover {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1800px;
    background:
        radial-gradient(circle at 50% 50%, rgba(255,255,255,0.045), transparent 38%),
        linear-gradient(135deg, #070b16, #0b1325 50%, #04070e);
    transition: opacity 1s ease;
}

/* Textura discreta */
.cover::before {
    content: "";
    position: absolute;
    inset: 0;
    opacity: 0.18;
    background-image:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,0.018) 0px,
            rgba(255,255,255,0.018) 1px,
            transparent 1px,
            transparent 4px
        );
    pointer-events: none;
}

/* Área da logo */
.logo-button {
    position: relative;
    z-index: 3;
    width: min(58vw, 260px);
    aspect-ratio: 1;
    border: none;
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.5s ease;
    -webkit-tap-highlight-color: transparent;
}
