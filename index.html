<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gabriella Victória</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
}

body{

  min-height:100vh;

  overflow:hidden;

  display:flex;

  align-items:center;

  justify-content:center;

  background:
    radial-gradient(
      ellipse at 50% 40%,
      #18263d 0%,
      #0d1728 42%,
      #050a12 100%
    );

  font-family:
    Georgia,
    "Times New Roman",
    serif;
}

body::after{

  content:"";

  position:fixed;

  inset:0;

  pointer-events:none;

  background:
    radial-gradient(
      ellipse at 50% 30%,
      rgba(255,255,255,.035),
      transparent 48%
    );
}


/* CENA */

.cena{

  position:relative;

  width:320px;
  height:520px;

  display:flex;

  align-items:center;

  justify-content:center;
}


/* SOMBRA */

.sombra{

  position:absolute;

  width:245px;
  height:30px;

  left:37px;
  bottom:13px;

  border-radius:50%;

  background:
    rgba(0,0,0,.72);

  filter:blur(17px);
}


/* ENVELOPE */

.envelope{

  position:relative;

  width:300px;
  height:450px;

  z-index:2;

  perspective:1200px;

  filter:
    drop-shadow(
      0 25px 30px rgba(0,0,0,.55)
    );
}


/* CORPO */

.corpo{

  position:absolute;

  inset:0;

  overflow:hidden;

  background:
    linear-gradient(
      135deg,
      #192942 0%,
      #101d31 43%,
      #081220 100%
    );

  border:
    1px solid rgba(211,216,225,.72);

  border-radius:3px;
}

.corpo::before{

  content:"";

  position:absolute;

  inset:0;

  opacity:.14;

  background:
    repeating-linear-gradient(
      0deg,
      rgba(255,255,255,.025) 0px,
      rgba(255,255,255,.025) 1px,
      transparent 1px,
      transparent 4px
    );
}


/* MOLDURA */

.moldura{

  position:absolute;

  inset:12px;

  border:
    1px solid rgba(205,211,220,.25);

  pointer-events:none;
}


/* DOBRA ESQUERDA */

.dobra-esquerda{

  position:absolute;

  left:0;
  bottom:0;

  width:300px;
  height:270px;

  background:
    linear-gradient(
      140deg,
      #1b2c45,
      #0a1423 72%
    );

  clip-path:
    polygon(
      0 0,
      50% 100%,
      0 100%
    );

  border-top:
    1px solid rgba(213,218,225,.34);

  z-index:3;
}


/* DOBRA DIREITA */

.dobra-direita{

  position:absolute;

  right:0;
  bottom:0;

  width:300px;
  height:270px;

  background:
    linear-gradient(
      220deg,
      #1b2c45,
      #0a1423 72%
    );

  clip-path:
    polygon(
      100% 0,
      50% 100%,
      100% 100%
    );

  border-top:
    1px solid rgba(213,218,225,.34);

  z-index:3;
}


/* DOBRA INFERIOR */

.dobra-inferior{

  position:absolute;

  left:0;
  bottom:0;

  width:300px;
  height:225px;

  background:
    linear-gradient(
      180deg,
      #14243b,
      #091321
    );

  clip-path:
    polygon(
      0 100%,
      50% 0,
      100% 100%
    );

  border-top:
    1px solid rgba(210,216,224,.30);

  z-index:4;
}


/* ABA SUPERIOR */

.aba{

  position:absolute;

  left:0;
  top:0;

  width:300px;
  height:235px;

  background:
    linear-gradient(
      160deg,
      #223550 0%,
      #172841 48%,
      #0a1425 100%
    );

  clip-path:
    polygon(
      0 0,
      100% 0,
      50% 100%
    );

  border-top:
    1px solid rgba(232,235,240,.82);

  z-index:10;

  transform-origin:50% 0%;

  transition:
    transform 1.35s cubic-bezier(.18,.78,.22,1),
    opacity .7s ease;
}

.aba::after{

  content:"";

  position:absolute;

  left:26px;
  right:26px;
  top:1px;

  height:1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(247,248,250,.8),
      transparent
    );
}


/* LACRE */

.lacre{

  position:absolute;

  left:150px;
  top:225px;

  width:104px;
  height:104px;

  transform:
    translate(-50%,-50%);

  z-index:30;

  border-radius:50%;

  cursor:pointer;

  display:flex;

  align-items:center;

  justify-content:center;

  background:
    radial-gradient(
      circle at 28% 20%,
      #ffffff 0%,
      #f0f1f3 17%,
      #c9ccd1 37%,
      #858a92 62%,
      #5e636b 73%,
      #dfe1e4 100%
    );

  border:
    1px solid rgba(255,255,255,.95);

  box-shadow:
    0 13px 25px rgba(0,0,0,.62),
    inset 0 2px 4px rgba(255,255,255,.95),
    inset 0 -6px 10px rgba(0,0,0,.35);

  transition:
    transform .3s ease,
    opacity .6s ease;
}


/* ANÉIS DO LACRE */

.lacre::before{

  content:"";

  position:absolute;

  inset:7px;

  border-radius:50%;

  border:
    1px solid rgba(48,52,58,.7);
}

.lacre::after{

  content:"";

  position:absolute;

  inset:12px;

  border-radius:50%;

  border:
    1px solid rgba(255,255,255,.5);
}


/* MONOGRAMA GV */

.gv{

  position:relative;

  width:72px;
  height:72px;

  z-index:2;
}

.gv span{

  position:absolute;

  font-family:
    "Times New Roman",
    Georgia,
    serif;

  font-weight:bold;

  font-size:56px;

  line-height:1;

  color:#292d33;

  text-shadow:
    0 1px 0 #ffffff,
    0 -1px 0 rgba(0,0,0,.18);
}

.gv .g{

  left:2px;
  top:4px;
}

.gv .v{

  left:27px;
  top:9px;
}


/* EFEITO AO TOCAR */

.lacre:hover{

  transform:
    translate(-50%,-50%)
    scale(1.045);
}

.lacre:active{

  transform:
    translate(-50%,-50%)
    scale(.94);
}


/* ENVELOPE ABERTO */

.envelope.aberto .aba{

  transform:
    rotateX(-165deg);

  opacity:.08;
}

.envelope.aberto .lacre{

  opacity:0;

  transform:
    translate(-50%,-50%)
    scale(.65);

  pointer-events:none;
}


/* CELULARES PEQUENOS */

@media(max-width:350px){

  .cena{

    transform:scale(.88);

  }

}

</style>

</head>


<body>


<div class="cena">


  <div class="sombra"></div>


  <div
    class="envelope"
    id="envelope"
  >


    <div class="corpo">


      <div class="moldura"></div>


      <div class="dobra-esquerda"></div>


      <div class="dobra-direita"></div>


      <div class="dobra-inferior"></div>


    </div>


    <div class="aba"></div>


    <div
      class="lacre"
      id="lacre"
      role="button"
      tabindex="0"
      aria-label="Abrir convite"
    >


      <div class="gv">

        <span class="g">G</span>

        <span class="v">V</span>

      </div>


    </div>


  </div>


</div>


<script>


const envelope =
  document.getElementById("envelope");


const lacre =
  document.getElementById("lacre");


function abrirEnvelope(){

  envelope.classList.add("aberto");

}


lacre.addEventListener(
  "click",
  abrirEnvelope
);


lacre.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter" ||
      event.key === " "
    ){

      event.preventDefault();

      abrirEnvelope();

    }

  }
);


</script>


</body>

</html>
