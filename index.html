<title>Gabriella Victória</title>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    min-height: 100vh;
    overflow: hidden;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            ellipse at center,
            #1a2942 0%,
            #0d1729 45%,
            #040811 100%
        );

    font-family: Georgia, "Times New Roman", serif;
}


/* ==============================
   CENA
============================== */

.cena {
    position: relative;

    width: min(82vw, 390px);
    aspect-ratio: 2 / 3;

    perspective: 1800px;
}


/* ==============================
   SOMBRA
============================== */

.sombra {
    position: absolute;

    left: 7%;
    right: 7%;
    bottom: 1%;

    height: 9%;

    border-radius: 50%;

    background: rgba(0,0,0,.65);

    filter: blur(22px);
}


/* ==============================
   CONVITE INTERNO
============================== */

.folha {
    position: absolute;

    width: 86%;
    height: 88%;

    left: 7%;
    top: 6%;

    padding: 45px 30px;

    background:
        linear-gradient(
            145deg,
            #f7f4ee,
            #e8e4dc
        );

    color: #161c27;

    box-shadow:
        0 18px 40px rgba(0,0,0,.38);

    transform:
        translateY(10%);

    transition:
        transform 1.45s cubic-bezier(.2,.75,.2,1);

    z-index: 1;
}

.folha h1 {
    font-size: 30px;
    font-weight: normal;

    letter-spacing: 3px;

    margin-bottom: 14px;
}
